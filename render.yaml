services:
  - type: web
    name: multi-agent-rag-api
    runtime: python
    plan: standard
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: rag-data
      mountPath: /var/data/rag
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: QDRANT_PATH
        value: /var/data/rag/qdrant
      - key: DATABASE_PATH
        value: /var/data/rag/sample.db
      - key: HF_HOME
        value: /var/data/rag/models
      - key: BACKEND_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: CORS_ORIGINS
        value: https://multi-agent-collaborative-rag.vercel.app
